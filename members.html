<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDEV CLUB Hack 2025 Roster</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
        }
        .member-card:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.5),
                        0 4px 6px -2px rgba(34, 197, 94, 0.05);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #161b22; }
        ::-webkit-scrollbar-thumb {
            background: #38a169;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: #2f855a; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-white">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8 p-4 bg-gray-800 rounded-xl shadow-2xl">
            <h1 class="text-3xl md:text-5xl font-extrabold text-green-400 tracking-tight mb-2">
                Hack 2025 Registered Members
            </h1>
            <p class="text-lg text-gray-400">GDEV CLUB Official Roster</p>
        </header>

        <!-- Sort Buttons -->
        <div class="flex flex-wrap justify-center gap-3 mb-8 p-4 bg-gray-800 rounded-xl shadow-lg">
            <button id="sort-time" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition transform hover:scale-105 shadow-md">
                Registered Order (Early Bird)
            </button>
            <button id="sort-alpha-asc" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition transform hover:scale-105 shadow-md">
                Alphabetical (A–Z)
            </button>
            <button id="sort-alpha-desc" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition transform hover:scale-105 shadow-md">
                Alphabetical (Z–A)
            </button>
        </div>

        <!-- Member Grid -->
        <div id="member-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <script>
        // 🧠 Member names in registration order
        const initialMembers = [
            "Jackson Mumo",
            "James Kaguanyu",
            "Fortunatus Ogwachi",
            "Gloria Keter",
            "Polly Mwangi",
            "Nduku Muoka",
            "James Nyambura",
            "R. Mugambi",
            "Vic Vondoom",
            "Yvonne Mutahi",
            "Bruno Kyalo",
            "Abigael C.",
            "Grace Jerop",
            "Zero Pressure",
            "Jacinta Kioko",
            "Dorice Ambunya",
            "Brian Kipla",
            "Nzomo",
            "John Wuor Odero",
            "Patrick Kariuki",
            "Adelyn Njeri",
            "Emmanuel Wasike",
            "Michael Tarimo",
            "Eric Karanja",
            "Faustine Letting",
            "Wambui Churu",
            "Anthony Mutugi",
            "Daisy Chepchirchir",
            "Njuguna Waweru",
            "Glenda Chelangat",
            "Hope Kabum",
            "Collins Rotich",
            "Felo Kirui",
            "Valerie Chebet",
            "Mercy Jebet",
            "Tulito Senjura",
            "Biij",
            "Chrysanthus Jumaa",
            "Emmanuel Kipyegon",
            "Glenda Chelangat",
            "Moses Muriithi",
            "Francis Odero",
            "Samuel Muturi",
            "Grace Nyandiko",
            "Jepsergon Tarus",
            "Vallerie Kipchumba",
            "James Muiru",
            "Laizer McGuire",
            "Martoo Martoo",
            "Joram Kimathi"
        ].map((name, index) => ({
            name,
            id: index + 1
        }));

        const memberListContainer = document.getElementById('member-list');

        // 🔧 Render function
        function renderMembers(members) {
            memberListContainer.innerHTML = '';
            members.forEach((member, index) => {
                const card = document.createElement('div');
                card.className = `member-card p-4 rounded-xl bg-gray-700 border-t-4 ${index < 3 ? 'border-yellow-400' : 'border-green-500'} transition duration-300 ease-in-out cursor-pointer shadow-lg`;

                const rank = index + 1;
                let icon = `#${rank}`;
                let rankColor = "text-gray-400";

                if (rank === 1) { icon = '🥇'; rankColor = 'text-yellow-400'; }
                else if (rank === 2) { icon = '🥈'; rankColor = 'text-gray-300'; }
                else if (rank === 3) { icon = '🥉'; rankColor = 'text-amber-600'; }

                const badge = `
                    <span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded-full text-blue-600 bg-blue-200">
                        Reg #${member.id}
                    </span>
                `;

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="text-xl md:text-2xl font-bold ${rankColor}">${icon}</div>
                        ${badge}
                    </div>
                    <div class="mt-2">
                        <p class="text-lg md:text-xl font-extrabold tracking-wide text-green-300">${member.name}</p>
                        <p class="text-sm text-gray-500 mt-1">GDEV CLUB Member</p>
                    </div>
                `;
                memberListContainer.appendChild(card);
            });
        }

        // 🔀 Sort function
        function sortMembers(type) {
            let sorted = initialMembers.slice();
            if (type === 'alpha-asc') sorted.sort((a, b) => a.name.localeCompare(b.name));
            else if (type === 'alpha-desc') sorted.sort((a, b) => b.name.localeCompare(a.name));
            else sorted.sort((a, b) => a.id - b.id);
            renderMembers(sorted);
        }

        // Load default order
        document.getElementById('sort-time').addEventListener('click', () => sortMembers('time'));
        document.getElementById('sort-alpha-asc').addEventListener('click', () => sortMembers('alpha-asc'));
        document.getElementById('sort-alpha-desc').addEventListener('click', () => sortMembers('alpha-desc'));
        sortMembers('time');
    </script>
</body>
</html>
